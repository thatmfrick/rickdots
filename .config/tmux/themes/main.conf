source-file "$HOME/.config/tmux/themes/gruvbox.conf"

set -g -F status-bg "#{@bg_main}"
set -g -F status-fg "#{@fg_main}"

set -g status-left "#[fg=#{@bg_main},bg=#{@color1},bold] #S #[fg=#{@bg_main},bg=#{@bg_main}]"

set -g window-status-format "#[fg=#{@color3},bg=#{@bg_main}] #I:#W "
set -g window-status-current-format "#[fg=#{@bg_main},bg=#{@color2},bold] #I:#W #[fg=#{@bg_main},bg=#{@bg_main}]"

set -g window-status-activity-style "fg=#{@color1},bg=#{@bg_main}"
set -g window-status-bell-style "fg=#{@color5},bg=#{@bg_main},bold"

set -g status-right "#[fg=#{@bg_sec},bg=#{@bg_main}]#[fg=#{@fg_main},bg=#{@bg_sec}] %H:%M  %d/%m #[fg=#{@color2},bg=#{@bg_sec}]#[fg=#{@bg_main},bg=#{@color4},bold] #h "

set -g pane-border-style "fg=#{@bg_sec}"
set -g pane-active-border-style "fg=#{@color2}"

set -g message-style "fg=#{@color2},bg=#{@bg_sec}"
set -g message-command-style "fg=#{@color1},bg=#{@bg_sec}"
set -g mode-style "fg=#{@bg_main},bg=#{@color2},bold"
set -g clock-mode-colour "#{@color2}"

set -g popup-style "fg=#{@fg_main},bg=#{@bg_sec}"
set -g popup-border-style "fg=#{@bg_sec},bg=#{@bg_sec}"
